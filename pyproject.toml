[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwrl"
version = "0.1.0"
description = "SYNTHOSAR fixed-wing simulation development workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
train = ["torch>=2.7,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
fwrl = "fwrl.cli:main"
fwrl-app = "fwrl.app:main"

[tool.setuptools.packages.find]
include = ["fwrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
fwrl = ["web/*.html"]
