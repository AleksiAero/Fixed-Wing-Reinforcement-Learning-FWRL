<!doctype html>
<html><head><meta charset="utf-8"><title>LIVE · Mountain flight training</title>
<style>
html,body{margin:0;overflow:hidden;background:#142531;color:#fff;font:15px system-ui}canvas{display:block}
#hud{position:absolute;left:28px;top:24px;padding:20px 24px;border-radius:16px;background:linear-gradient(135deg,#14232ce8,#101e28c9);backdrop-filter:blur(18px);border:1px solid #ffffff20;box-shadow:0 8px 30px #0003;width:315px}
h1{font-size:15px;letter-spacing:.04em;margin:0 0 14px}.live{color:#55efbb}#speed{font-size:42px;font-weight:650}#details{line-height:1.9;color:#c2d5e0;margin-top:10px}
button{border:1px solid #7a969c;border-radius:8px;background:#1f3a48;color:white;padding:10px 12px;margin:10px 6px 0 0;cursor:pointer}
#note{position:absolute;bottom:24px;left:28px;background:#10212bd9;padding:12px 18px;border-radius:10px;color:#d4e2e9}
#controls{position:absolute;right:28px;bottom:24px;width:280px;background:#101e28db;border:1px solid #ffffff20;border-radius:16px;padding:18px 22px;backdrop-filter:blur(18px)}
#controls small{color:#91aab7;letter-spacing:.15em;font-size:10px}#surfaces{display:flex;gap:22px;margin-top:14px}#surfaces div{flex:1;color:#bfd0db;font-size:12px}#surfaces i{display:block;height:5px;margin:14px 0;background:#ffad57;transform-origin:center;transition:transform .05s linear}#surfaces b{font:16px ui-monospace,monospace;color:#fff}#motor{font-size:12px;color:#8eabba;margin-top:12px}button:hover{background:#38606e;border-color:#8bdfcc}#note{font-size:11px;letter-spacing:.03em}#details{font-size:13px}
</style></head><body>
<div id="hud"><h1><span class="live">● LIVE</span> Mountain flight training</h1><div id="speed">Connecting…</div><div id="details">Loading the current simulation</div><button id="pause">Pause / resume</button><button id="camera">Course overview</button><button id="launcher">Launcher view</button><button id="aircraft">Aircraft view</button></div>
<div id="note">Actual training state · Random policy learning from zero · Target 200 mph</div>
<div id="controls"><small>LIVE CONTROL SURFACES</small><div id="surfaces"><div>LEFT ELEVON<i id="leftBar"></i><b id="leftAngle">0.0°</b></div><div>RIGHT ELEVON<i id="rightBar"></i><b id="rightAngle">0.0°</b></div></div><div id="motor">Motor 0% · Actual servo positions</div></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
const data=await fetch('/scene').then(r=>r.json()),w=data.world;
T.Object3D.DEFAULT_UP.set(0,0,1);
const scene=new T.Scene();scene.background=new T.Color('#aabfc8');scene.fog=new T.FogExp2('#aabfc8',.000028);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,40000);
scene.add(new T.HemisphereLight(0xc8e0ff,0x5c6650,1.8));const sun=new T.DirectionalLight(0xffe4bc,2.6);sun.position.set(-2000,-3000,6000);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:1,far:300});sun.shadow.bias=-.0002;sun.shadow.normalBias=.035;
const sky=new T.Mesh(new T.SphereGeometry(30000,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,vertexShader:`varying vec3 vDirection;void main(){vDirection=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vDirection;void main(){vec3 d=normalize(vDirection);float h=max(d.z,0.);vec3 col=mix(vec3(.68,.77,.80),vec3(.13,.34,.57),pow(h,.55));float glow=pow(max(dot(d,normalize(vec3(.8,.4,.133))),0.),70.);col+=vec3(1.,.75,.4)*glow*.35;gl_FragColor=vec4(col,1.);}`}));scene.add(sky);
const sunDisc=new T.Mesh(new T.SphereGeometry(100,24,16),new T.MeshBasicMaterial({color:0xffecc5,fog:false}));scene.add(sunDisc);
const glowCanvas=document.createElement('canvas');glowCanvas.width=glowCanvas.height=128;const glowCtx=glowCanvas.getContext('2d');const gradient=glowCtx.createRadialGradient(64,64,2,64,64,64);gradient.addColorStop(0,'rgba(255,230,175,.6)');gradient.addColorStop(.25,'rgba(255,218,155,.15)');gradient.addColorStop(1,'rgba(255,215,150,0)');glowCtx.fillStyle=gradient;glowCtx.fillRect(0,0,128,128);const sunHalo=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(glowCanvas),transparent:true,depthWrite:false,fog:false,blending:T.AdditiveBlending}));sunHalo.scale.set(1200,1200,1);scene.add(sunHalo);
const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(data.ground.flat(),3));
const indices=[];for(let j=0;j<data.ny;j++)for(let i=0;i<data.nx;i++){let a=j*(data.nx+1)+i;indices.push(a,a+1,a+data.nx+2,a,a+data.nx+2,a+data.nx+1)}geometry.setIndex(indices);geometry.computeVertexNormals();
const terrainMat=new T.MeshStandardMaterial({roughness:1});
terrainMat.onBeforeCompile=shader=>{
shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vTerrain; varying vec3 vTerrainNormal;').replace('#include <begin_vertex>','#include <begin_vertex>\nvTerrain=position;vTerrainNormal=normal;');
shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vTerrain;varying vec3 vTerrainNormal;
float hashTerrain(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noiseTerrain(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hashTerrain(i),hashTerrain(i+vec2(1,0)),f.x),mix(hashTerrain(i+vec2(0,1)),hashTerrain(i+vec2(1,1)),f.x),f.y);}
`).replace('#include <color_fragment>',`#include <color_fragment>
float broad=noiseTerrain(vTerrain.xy*.007);float footprint=max(length(dFdx(vTerrain.xy)),length(dFdy(vTerrain.xy)));float detail=mix(noiseTerrain(vTerrain.xy*.3),.5,smoothstep(1.,8.,footprint));float grain=mix(noiseTerrain(vTerrain.xy*5.),.5,smoothstep(.05,.5,footprint));
float slope=1.-abs(normalize(vTerrainNormal).z);
vec3 grass=mix(vec3(.12,.19,.095),vec3(.31,.34,.18),broad);
vec3 rock=mix(vec3(.24,.26,.25),vec3(.44,.43,.39),detail);
vec3 land=mix(grass,rock,clamp(smoothstep(.12,.46,slope)+smoothstep(480.,900.,vTerrain.z)*.25,0.,1.));
float snow=smoothstep(850.+broad*140.,1100.,vTerrain.z)*(1.-smoothstep(.25,.6,slope));
land=mix(land,vec3(.82,.87,.88),snow);diffuseColor.rgb=land*(.86+.18*detail+.07*grain);
`);};
const terrain=new T.Mesh(geometry,terrainMat);terrain.receiveShadow=true;scene.add(terrain);
const rings=w.waypoints.map((p,i)=>{const ring=new T.Mesh(new T.TorusGeometry(w.gate_radii_m?.[i]??w.goal_radius_m,w.hoops.tube_radius_m,16,112),new T.MeshStandardMaterial({color:i===0?0x51ffae:0xff7b25,emissive:0x342718,metalness:.5,roughness:.28}));ring.position.fromArray(p);ring.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),new T.Vector3(...data.normals[i]));scene.add(ring);return ring});
const plane=new T.Group();scene.add(plane);const paint=new T.MeshStandardMaterial({color:0xfaf8e9}),orange=new T.MeshStandardMaterial({color:0xff6b21});
function box(size,position,mat=paint,parent=plane){const m=new T.Mesh(new T.BoxGeometry(...size),mat);m.position.fromArray(position);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const aircraftParts={};
for(const part of data.airframe){const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(part.vertices.flat(),3));geo.setIndex(part.faces.flat());geo.computeVertexNormals();const mesh=new T.Mesh(geo,new T.MeshStandardMaterial({color:new T.Color(...part.color),roughness:.38,metalness:.32,side:T.DoubleSide}));mesh.position.fromArray(part.pivot);mesh.castShadow=true;mesh.receiveShadow=true;(part.parent?aircraftParts[part.parent]:plane).add(mesh);aircraftParts[part.name]=mesh;mesh.userData.hingeAxis=part.hinge_axis}
const elevons=[aircraftParts['Left elevon'],aircraftParts['Right elevon']];
const pushrods=[1,-1].map(sign=>{const rod=new T.Mesh(new T.CylinderGeometry(.003,.003,1,8),new T.MeshStandardMaterial({color:0xcbd6df,metalness:.8,roughness:.22}));plane.add(rod);return rod});
function updateControls(s){for(let i=0;i<2;i++){let sign=i===0?1:-1,angle=s[17+i]??0;const horn=aircraftParts[(i===0?'Left':'Right')+' control horn'];const end=new T.Vector3().fromBufferAttribute(horn.geometry.attributes.position,2).applyQuaternion(elevons[i].quaternion).add(elevons[i].position);const start=new T.Vector3(.55*(-.22)-.35*.43+.06-.12,sign*.43*1.35,.065);const delta=end.clone().sub(start);pushrods[i].position.copy(start).add(end).multiplyScalar(.5);pushrods[i].scale.y=delta.length();pushrods[i].quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());const name=i===0?'left':'right';document.querySelector('#'+name+'Angle').textContent=(angle*180/Math.PI).toFixed(1)+'°';document.querySelector('#'+name+'Bar').style.transform=`rotate(${angle*180/Math.PI}deg)`;}document.querySelector('#motor').textContent=`Motor ${Math.round((s[19]??0)*100)}% · Actual servo positions`;}
const railMat=new T.MeshStandardMaterial({color:0x354d59});
for(const r of data.launcher.rails){const rail=box(r.size,r.center,railMat,scene);rail.rotation.set(0,-data.launcher.pitch_rad,data.launcher.heading_rad,'ZYX')}
for(const r of data.launcher.supports){const support=box(r.size,r.center,railMat,scene);support.rotation.z=data.launcher.heading_rad}

// Dense tree clusters remain inside the existing tree collision volumes.
const treeCount=w.obstacles.length*9,treeMatrix=new T.Object3D();
const trunks=new T.InstancedMesh(new T.CylinderGeometry(.12,.19,1,6),new T.MeshStandardMaterial({color:0x554433,roughness:1}),treeCount);
const foliage=new T.InstancedMesh(new T.ConeGeometry(1,1,9),new T.MeshStandardMaterial({color:0x2c5136,roughness:1}),treeCount*3);
let treeIndex=0;for(const o of w.obstacles){for(let k=0;k<9;k++){
const angle=k*2.39996,radius=k===0?0:Math.sqrt(k/8)*o.size[0]*.25;
const x=o.center[0]+Math.cos(angle)*radius,y=o.center[1]+Math.sin(angle)*radius;
const h=o.size[2]*(k===0?.95:.48+.18*((k*7%9)/9));const base=o.center[2]-o.size[2]/2;
treeMatrix.position.set(x,y,base+h*.35);treeMatrix.rotation.set(Math.PI/2,0,0);treeMatrix.scale.set(1,h*.7,1);treeMatrix.updateMatrix();trunks.setMatrixAt(treeIndex,treeMatrix.matrix);
for(let layer=0;layer<3;layer++){const crownRadius=o.size[0]*(k===0?.26:.14)*(1-layer*.22);treeMatrix.position.set(x,y,base+h*(.45+layer*.18));treeMatrix.scale.set(crownRadius,h*.48,crownRadius);treeMatrix.updateMatrix();foliage.setMatrixAt(treeIndex*3+layer,treeMatrix.matrix);foliage.setColorAt(treeIndex*3+layer,new T.Color().setHSL(.29+(k%3)*.015,.24,.17+(k%4)*.018));}treeIndex++;}}
trunks.castShadow=true;foliage.castShadow=true;scene.add(trunks,foliage);
let packet=null,overview=false,launchView=false,inspectPlane=false,lastIndex=-1;
document.querySelector('#pause').onclick=()=>fetch('/pause',{method:'POST'});
document.querySelector('#aircraft').onclick=()=>{inspectPlane=!inspectPlane;overview=false;launchView=false;};
document.querySelector('#launcher').onclick=()=>{inspectPlane=false;launchView=!launchView;overview=false;};
document.querySelector('#camera').onclick=()=>{inspectPlane=false;launchView=false;overview=!overview;};
async function poll(){try{packet=await fetch('/state').then(r=>r.json());const s=packet.state;plane.position.set(...s.slice(0,3));if(s.length>=20){plane.quaternion.set(s[8],s[9],s[10],s[7]);elevons.forEach((e,i)=>e.quaternion.setFromAxisAngle(new T.Vector3(...e.userData.hingeAxis),s[17+i]));updateControls(s)}else plane.rotation.set(-s[5],-s[6],s[3],'ZYX');
document.querySelector('#speed').textContent=(s[4]/.44704).toFixed(1)+' mph';const stale=Date.now()/1000-packet.published_at>3;
document.querySelector('#details').textContent=`Hoop ${packet.index+1} / ${rings.length} · Episode ${packet.episode}\n${packet.steps.toLocaleString()} transitions · ${stale?'Waiting for trainer':packet.status}\n${(packet.gate_time_left_s??0).toFixed(1)}s to next hoop · Reward ${(packet.reward??0).toFixed(1)}\nAoA ${(packet.alpha_deg??0).toFixed(1)}°${Math.abs(packet.alpha_deg??0)>15?' · STALLED':''}`;document.querySelector('#details').style.whiteSpace='pre-line';
if(lastIndex!==packet.index){rings.forEach((r,i)=>r.material.color.setHex(i===packet.index?0x51ffae:0xff7b25));lastIndex=packet.index}
}catch(e){document.querySelector('#details').textContent='Connection interrupted — holding last position'}setTimeout(poll,50)}poll();
function draw(){requestAnimationFrame(draw);if(packet){const s=packet.state;if(inspectPlane){const local=new T.Vector3(1.7,-2.0,1.4).applyQuaternion(plane.quaternion);camera.position.copy(plane.position).add(local);camera.lookAt(plane.position)}else if(launchView){camera.position.set(w.start[0]-25,w.start[1]-36,w.start[2]+15);camera.lookAt(w.start[0]+8,w.start[1],w.start[2]+2)}else if(overview){camera.position.set(1800,-5700,2500);camera.lookAt(5300,1200,420)}else{camera.position.set(s[0]-8*Math.cos(s[3])+3*Math.sin(s[3]),s[1]-8*Math.sin(s[3])-3*Math.cos(s[3]),s[2]+3);camera.lookAt(s[0]+8*Math.cos(s[3]),s[1]+8*Math.sin(s[3]),s[2]+1)}}if(packet?.state?.[19]>0 && packet.status==='learning')aircraftParts['Rear propeller'].rotation.x+=packet.state[19]*.6;sun.target.position.copy(plane.position);sun.position.copy(plane.position).add(new T.Vector3(120,60,20));sky.position.copy(camera.position);sunDisc.position.copy(camera.position).add(new T.Vector3(120,60,20).normalize().multiplyScalar(9000));sunHalo.position.copy(sunDisc.position);renderer.render(scene,camera)}draw();
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
